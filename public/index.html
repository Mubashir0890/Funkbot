<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Funk Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #14101f);
    --text: var(--tg-theme-text-color, #fff);
    --hint: var(--tg-theme-hint-color, #9a93b5);
    --card: var(--tg-theme-secondary-bg-color, #1f1833);
    --accent: #ff8a00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 16px 16px 150px;
  }
  h1 { font-size: 22px; margin-bottom: 12px; }
  nav { display: flex; gap: 8px; margin-bottom: 16px; }
  nav a { flex: 1; text-align: center; padding: 10px; border-radius: 12px; background: var(--card); color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px; }
  nav a.on { background: var(--accent); color: #000; }
  .search { display: flex; gap: 8px; margin-bottom: 16px; }
  .search input {
    flex: 1; padding: 12px 14px; border-radius: 12px; border: none;
    background: var(--card); color: var(--text); font-size: 15px; outline: none;
  }
  .search button {
    padding: 0 16px; border: none; border-radius: 12px;
    background: var(--accent); color: #000; font-weight: 700; cursor: pointer;
  }
  .track {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); padding: 10px; border-radius: 14px;
    margin-bottom: 10px; cursor: pointer;
  }
  .track.active { outline: 2px solid var(--accent); }
  .track img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #333; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 13px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dur { font-size: 12px; color: var(--hint); }
  .msg { text-align: center; color: var(--hint); padding: 30px 0; }

  .player {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--card); padding: 12px 16px 18px;
    border-top-left-radius: 18px; border-top-right-radius: 18px;
    box-shadow: 0 -4px 20px rgba(0,0,0,.35);
  }
  .now { font-size: 14px; font-weight: 600; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 6px; }
  .controls button {
    background: none; border: none; color: var(--text); font-size: 26px; cursor: pointer;
  }
  .controls .play {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); color: #000; font-size: 22px;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
</style>
</head>
<body>
  <h1>🎷 Funk Player</h1>
  <nav>
    <a href="/" class="on">🎶 Pleyer</a>
    <a href="/create.html">🥁 Yaratish</a>
  </nav>
  <div class="search">
    <input id="q" placeholder="Qidirish (masalan: groove)" />
    <button id="go">Izla</button>
  </div>
  <div id="list"><div class="msg">Yuklanmoqda...</div></div>

  <div class="player">
    <div class="now" id="now">Trek tanlang</div>
    <input type="range" id="seek" min="0" max="100" value="0" />
    <div class="controls">
      <button id="prev">⏮</button>
      <button id="toggle" class="play">▶</button>
      <button id="next">⏭</button>
    </div>
  </div>
  <audio id="audio"></audio>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();

  const $ = (id) => document.getElementById(id);
  const audio = $("audio");
  let tracks = [], cur = -1;

  const fmt = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

  async function load(q = "") {
    $("list").innerHTML = '<div class="msg">Yuklanmoqda...</div>';
    try {
      const r = await fetch("/api/tracks?q=" + encodeURIComponent(q));
      const data = await r.json();
      if (data.error) throw new Error(data.error);
      tracks = data.tracks;
      render();
    } catch (e) {
      $("list").innerHTML = '<div class="msg">Xatolik: ' + e.message + "</div>";
    }
  }

  function render() {
    if (!tracks.length) {
      $("list").innerHTML = '<div class="msg">Hech narsa topilmadi</div>';
      return;
    }
    $("list").innerHTML = tracks.map((t, i) => `
      <div class="track ${i === cur ? "active" : ""}" data-i="${i}">
        <img src="${t.image}" alt="" />
        <div class="info">
          <div class="name">${esc(t.name)}</div>
          <div class="artist">${esc(t.artist)}</div>
        </div>
        <div class="dur">${fmt(t.duration)}</div>
      </div>`).join("");
    document.querySelectorAll(".track").forEach((el) =>
      el.addEventListener("click", () => play(+el.dataset.i)));
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function play(i) {
    if (i < 0 || i >= tracks.length) return;
    cur = i;
    audio.src = tracks[i].audio;
    audio.play();
    $("now").textContent = tracks[i].name + " — " + tracks[i].artist;
    render();
  }

  $("toggle").onclick = () => {
    if (cur === -1 && tracks.length) return play(0);
    audio.paused ? audio.play() : audio.pause();
  };
  $("next").onclick = () => play((cur + 1) % tracks.length);
  $("prev").onclick = () => play((cur - 1 + tracks.length) % tracks.length);

  audio.addEventListener("play", () => ($("toggle").textContent = "⏸"));
  audio.addEventListener("pause", () => ($("toggle").textContent = "▶"));
  audio.addEventListener("ended", () => $("next").click());
  audio.addEventListener("timeupdate", () => {
    if (audio.duration) $("seek").value = (audio.currentTime / audio.duration) * 100;
  });
  $("seek").addEventListener("input", (e) => {
    if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
  });

  $("go").onclick = () => load($("q").value);
  $("q").addEventListener("keydown", (e) => e.key === "Enter" && load($("q").value));

  load();
</script>
</body>
</html>
