services:
  - type: web
    name: funk-miniapp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      # Ixtiyoriy, lekin tavsiya etiladi: ro'yxat qayta ishga tushganda o'chib ketmasligi uchun
      - key: GITHUB_TOKEN
        sync: false
      - key: GIST_ID
        sync: false
        
